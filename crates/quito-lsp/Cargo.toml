[package]
name = "quito-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Language Server Protocol server for the Quito OpenSCAD reimplementation"

[[bin]]
name = "quito-lsp"
path = "src/main.rs"

[dependencies]
quito-syntax = { workspace = true }
quito-eval = { workspace = true }
quito-geom = { workspace = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
