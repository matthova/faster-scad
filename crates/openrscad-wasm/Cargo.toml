[package]
name = "openrscad-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openrscad-syntax = { workspace = true }
openrscad-eval = { workspace = true }
openrscad-geom = { workspace = true }
openrscad-ir = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
# Runs the crate's tests in a real browser via `wasm-pack test`, exercising the
# boolmesh-on-wasm kernel path that browsers actually execute.
wasm-bindgen-test = "0.3"
