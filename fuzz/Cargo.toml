# Standalone cargo-fuzz crate (deliberately its own workspace so the heavy
# libfuzzer/nightly-only build stays out of the main `cargo build --workspace`).
# Run with nightly, e.g. `cargo +nightly fuzz run parse`.
[package]
name = "quito-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
quito-syntax = { path = "../crates/quito-syntax" }
quito-eval = { path = "../crates/quito-eval" }
quito-geom = { path = "../crates/quito-geom" }

# Fuzz binaries: no test/doc harness, and each is its own target.
[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eval"
path = "fuzz_targets/eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_stl"
path = "fuzz_targets/import_stl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_3mf"
path = "fuzz_targets/import_3mf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_amf"
path = "fuzz_targets/import_amf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_off"
path = "fuzz_targets/import_off.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_obj"
path = "fuzz_targets/import_obj.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_dxf"
path = "fuzz_targets/import_dxf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_svg"
path = "fuzz_targets/import_svg.rs"
test = false
doc = false
bench = false
