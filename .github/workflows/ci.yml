name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The BOSL2 corpus is a git submodule; the oracle step below fails
          # hard if it is absent, so it must be checked out.
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # C++ Manifold (native backend) needs cmake.
      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      # The echo oracle runs against committed goldens (no OpenSCAD needed).
      - name: Echo oracle
        run: cargo run -p xtask -- echo

      # The BOSL2 function suite runs against the corpus/BOSL2 submodule
      # (parse+eval only, no OpenSCAD needed). Hard-fails if any listed test
      # is missing, errors, or executes zero assertions.
      - name: BOSL2 function suite
        run: cargo run -p xtask -- bosl2

      # The geometry oracle diffs quito's native render against committed
      # goldens blessed from OpenSCAD 2024.12 (no OpenSCAD needed here). Hard-
      # fails on any metric mismatch or an empty/missing corpus.
      - name: Geometry oracle
        run: cargo run -p xtask -- geom

      # Warm-edit gate (the M4 promise): render each benches/models/*.scad cold
      # then warm in-process (native kernel, GeomCache reused) and hard-fail if
      # any warm re-render exceeds a generous threshold. This guards the cache's
      # structural-hash / invalidation logic — a silent regression makes the
      # warm render recompute geometry, so warm approaches cold and the gate
      # trips. No OpenSCAD or release binary needed. An empty corpus is a hard
      # failure (no vacuous pass). Runs in debug, reusing the build above; warm
      # is cache-lookups + one mesh clone, sub-millisecond even unoptimized.
      - name: Warm-edit gate
        run: cargo run -p xtask -- warm-gate

      # The wasm engine must keep compiling for the browser target.
      - name: Build wasm engine target
        run: cargo build -p quito-wasm --target wasm32-unknown-unknown

  # Typecheck and build the web playground on every PR. deploy-pages.yml only
  # runs tsc/vite on push to main, so without this a PR can merge TypeScript
  # that breaks the live site and the breakage is only found at deploy time.
  # This also smoke-tests that quito-wasm actually builds with wasm-pack (not
  # just `cargo check` for the target, which the test job above covers).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Reuse the cache key that deploy-pages.yml warms on push to main, so PR
      # builds restore the already-compiled wasm target (the slow part).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Vitest unit tests for the pure-logic modules (export writers, customizer
      # schema parsing, share-link round-trip). No DOM/wasm needed, so they run
      # before the wasm build and fail fast.
      - name: Unit tests (vitest)
        working-directory: web
        run: npm test

      - name: Build wasm engine
        working-directory: web
        run: npm run build:wasm

      # `npm run build` is `tsc -b && vite build` — typechecks and bundles, so a
      # PR can't merge TypeScript that breaks the live site.
      - name: Typecheck and build site
        working-directory: web
        run: npm run build

  # Compile the Tauri desktop app on every PR. desktop/src-tauri is a
  # standalone cargo workspace outside the main one, so no other job builds it —
  # engine-surface refactors can break the desktop app silently (this already
  # required a manual Cargo.lock sync commit, 0906018). Full bundling isn't
  # needed; a clean compile is the regression gate. Runs on macOS: it matches
  # the real target platform and ships cmake (the native Manifold C++ kernel
  # quito-geom depends on) and the webkit stack, so there's no apt setup.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (desktop)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # tauri::generate_context! embeds the frontend named by tauri.conf.json's
      # frontendDist (../../web/dist). The real bundle is already gated by the
      # web job and deploy-pages; here a placeholder satisfies the macro so the
      # Rust side compiles without the (slow) wasm-pack + vite build.
      - name: Stub frontend dist
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>quito</title>' > web/dist/index.html

      - name: Build desktop app
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

  # Fuzz the code that ingests untrusted public input — the parser, the
  # evaluator (parse-then-eval, under a fuel budget), and the mesh/vector
  # importers — which run in the browser worker (a panic crashes it) and
  # natively in the CLI/desktop. A short libFuzzer smoke run per target on every
  # PR; long/nightly runs stay local. Committed reproducers under
  # fuzz/regressions/ are replayed first so a fixed crash can't silently return.
  # See fuzz/README.md.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz requires nightly (sanitizers / -Z flags); the repo's
      # rust-toolchain.toml pins stable, which `cargo +nightly` overrides.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}

      # quito-geom pulls in manifold-csg-sys (C++/cmake) transitively.
      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz smoke run
        run: |
          set -euo pipefail
          # Pin the gnu target: cargo-fuzz can default to the musl host triple,
          # whose static crt-static is incompatible with the address sanitizer
          # ("sanitizer is incompatible with statically linked libc"). gnu std is
          # present as the runner's host toolchain.
          TARGET=x86_64-unknown-linux-gnu
          for t in parse eval import_stl import_3mf import_amf import_off import_obj import_dxf import_svg; do
            asan=""
            case "$t" in
              parse) seeds="corpus/echo examples benches/models" ;;
              # The evaluator builds Rc<RefCell<Scope>> closures whose captured
              # env points back at the defining scope — reference cycles that
              # LeakSanitizer flags even on valid programs. This target hunts
              # panics/hangs/OOM, not leaks, and the libFuzzer -detect_leaks flag
              # doesn't stop ASan's atexit leak check, so disable it at the
              # runtime level here (leak detection stays on for the others).
              eval)  seeds="corpus/echo examples benches/models"; asan="ASAN_OPTIONS=detect_leaks=0" ;;
              *)     seeds="corpus/geom" ;;
            esac
            echo "::group::fuzz $t"
            # Replay committed reproducers first (deterministic, near-instant).
            if [ -d "fuzz/regressions/$t" ]; then
              env $asan cargo +nightly fuzz run --target "$TARGET" "$t" "fuzz/regressions/$t" -- -runs=0
            fi
            # Then a short randomized smoke pass. The FIRST corpus dir is where
            # libFuzzer *writes* newly-found inputs, so it must be a scratch dir
            # (fuzz/corpus is gitignored) — the repo seed dirs follow as
            # read-only inputs and must never be the write target.
            mkdir -p "fuzz/corpus/$t"
            env $asan cargo +nightly fuzz run --target "$TARGET" "$t" "fuzz/corpus/$t" $seeds -- \
              -max_total_time=20 -rss_limit_mb=2048 -timeout=25
            echo "::endgroup::"
          done

  # Execute quito-wasm's tests in a real browser via wasm-pack. The main `test`
  # job runs them on the host (native Manifold kernel); this is the only job
  # that exercises the pure-Rust boolmesh kernel compiled to wasm — the path
  # browsers actually run, and the one the Manifold-vs-boolmesh differential
  # exists to protect. Chrome is preinstalled on the runner; wasm-pack fetches a
  # matching chromedriver. No cmake: manifold-csg (C++) is cfg'd out on wasm.
  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Share the cache key deploy-pages.yml / the web job warm.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run quito-wasm tests in headless Chrome
        run: wasm-pack test --headless --chrome crates/quito-wasm
