name: Release desktop app

# Cut a desktop release MANUALLY from the Actions tab (or `gh workflow run`):
#   Actions → "Release desktop app" → Run workflow → enter the version tag,
#   e.g. v0.1.0. The tag must match `version` in
#   desktop/src-tauri/tauri.conf.json.
#
# This runs ONLY on manual dispatch — pushing a tag does NOT start a release.
#
# It builds + signs the app on each OS, then creates a DRAFT GitHub Release
# with the installers and the updater manifest (latest.json). Review the draft,
# then PUBLISH it: the in-app updater reads
#   https://github.com/matthova/faster-scad/releases/latest/download/latest.json
# which only resolves to a published, non-prerelease release.
#
# Required repository secrets (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY           — minisign private key (updater signing)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password
# Optional (OS code-signing / notarization) are documented in docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match tauri.conf.json version), e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built per-arch on native runners rather than as one
          # universal binary: quito-geom links the native Manifold C++ kernel,
          # whose CMake build only produces the runner's host arch, so a
          # cross-compiled `universal-apple-darwin` fails to link the x86_64
          # slice. macos-latest is Apple Silicon; macos-13 is Intel. Each emits
          # its own updater entry (darwin-aarch64 / darwin-x86_64) in latest.json.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-13
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # quito-geom builds the native Manifold C++ kernel; the BOSL2 corpus
          # submodule isn't needed to bundle, so a shallow checkout is fine.
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo (release)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-release-${{ matrix.platform }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # The native Manifold C++ kernel (quito-geom -> manifold-csg-sys) needs cmake.
      - name: Install cmake
        uses: lukka/get-cmake@latest

      # Tauri v2's Linux bundler needs the webkit / gtk / appindicator stack.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        shell: bash

      # The desktop build's beforeBuildCommand runs `npm --prefix ../web run
      # build:wasm && build`, but it does NOT install the web deps first — do it
      # here so the wasm + vite build can run.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Provides the @tauri-apps/cli that tauri-action invokes.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build, sign, and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action creates the GitHub Release via the API and needs a token
          # with `contents: write` (granted in the job `permissions` above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Without these the updater artifacts are
          # unsigned and the app refuses them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---- Optional macOS code-signing + notarization (see RELEASING.md) ----
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # desktop/ holds package.json; tauri finds src-tauri/tauri.conf.json.
          projectPath: desktop
          tagName: ${{ inputs.tag }}
          releaseName: "Quito __VERSION__"
          releaseBody: "See the assets below to download and install Quito."
          # Draft so a human can review before publishing. `releases/latest`
          # only resolves once the release is published and not a prerelease.
          releaseDraft: true
          prerelease: false
          # Emits latest.json (the updater manifest) alongside the installers.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
