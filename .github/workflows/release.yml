name: Release desktop app

# Cut a desktop release by PUBLISHING a GitHub Release:
#   Releases → "Draft a new release" → create a tag like `v0.1.0` → Publish.
#
# The release TAG is the single source of truth for the version: the build
# stamps `v0.1.0` -> `0.1.0` into tauri.conf.json (see "Stamp version" below),
# so you never bump the version in the repo to cut a release.
#
# Publishing fires this workflow, which builds + signs the app on each OS and
# uploads the installers plus the updater manifest (latest.json) as assets on
# the release you just published. The in-app updater reads
#   https://github.com/matthova/faster-scad/releases/latest/download/latest.json
# which resolves to the latest published, non-prerelease release.
#
# Because the build attaches assets AFTER you publish, the installers appear a
# few minutes later once the matrix finishes.
#
# A manual `workflow_dispatch` (Actions tab, or `gh workflow run`) is also
# available for re-running a build against an existing tag/release.
#
# Required repository secrets (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY           — minisign private key (updater signing)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password
# Optional (OS code-signing / notarization) are documented in docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match tauri.conf.json version), e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built per-arch on native runners rather than as one
          # universal binary: quito-geom links the native Manifold C++ kernel,
          # whose CMake build only produces the runner's host arch, so a
          # cross-compiled `universal-apple-darwin` fails to link the x86_64
          # slice. macos-latest is Apple Silicon; macos-15-intel is Intel (the
          # x86_64 replacement after GitHub retired the macos-13 image in Dec
          # 2025 — available until Aug 2027, after which hosted Intel macOS goes
          # away entirely). Each emits its own updater entry (darwin-aarch64 /
          # darwin-x86_64) in latest.json.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            # Stable, version-less alias uploaded alongside the versioned .dmg so
            # the README can link releases/latest/download/<name> permanently.
            bundle-glob: "desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
            stable-name: "Quito-macos-aarch64.dmg"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
            bundle-glob: "desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
            stable-name: "Quito-macos-x64.dmg"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            # AppImage is the only self-updating Linux format, so that's what the
            # download table links; .deb/.rpm stay reachable via the release page.
            bundle-glob: "desktop/src-tauri/target/release/bundle/appimage/*.AppImage"
            stable-name: "Quito-linux-x86_64.AppImage"
          - platform: windows-latest
            args: ""
            rust-targets: ""
            bundle-glob: "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe"
            stable-name: "Quito-windows-x64-setup.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # quito-geom builds the native Manifold C++ kernel; the BOSL2 corpus
          # submodule isn't needed to bundle, so a shallow checkout is fine.
          submodules: false

      # The release tag is the single source of truth for the version. The
      # updater manifest (latest.json) and the installer version both come from
      # tauri.conf.json's `version`, so stamp the tag into it here (in the
      # ephemeral CI checkout only — nothing is committed back). This is why you
      # never bump the version in the repo to cut a release. Cargo.toml is left
      # alone: rewriting it would invalidate the cached `--locked` build, and the
      # crate version doesn't feed the updater.
      - name: Stamp version from release tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Release tag '$TAG' is not a valid vX.Y.Z semver tag."
            exit 1
          fi
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs'),j=require('./'+f);j.version='${VERSION}';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Stamped tauri.conf.json version = $VERSION (from tag $TAG)."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo (release)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-release-${{ matrix.platform }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # The native Manifold C++ kernel (quito-geom -> manifold-csg-sys) needs cmake.
      - name: Install cmake
        uses: lukka/get-cmake@latest

      # Tauri v2's Linux bundler needs the webkit / gtk / appindicator stack.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        shell: bash

      # The desktop build's beforeBuildCommand runs `npm --prefix ../web run
      # build:wasm && build`, but it does NOT install the web deps first — do it
      # here so the wasm + vite build can run.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Provides the @tauri-apps/cli that tauri-action invokes.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build, sign, and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action creates the GitHub Release via the API and needs a token
          # with `contents: write` (granted in the job `permissions` above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Without these the updater artifacts are
          # unsigned and the app refuses them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---- Optional macOS code-signing + notarization (see RELEASING.md) ----
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # desktop/ holds package.json; tauri finds src-tauri/tauri.conf.json.
          projectPath: desktop
          # On `release: published` this is the tag you just published; on manual
          # dispatch it's the tag input. tauri-action finds the existing release
          # for this tag and uploads assets to it.
          tagName: ${{ github.event.release.tag_name || inputs.tag }}
          releaseName: "Quito __VERSION__"
          releaseBody: "See the assets below to download and install Quito."
          # The release already exists (you published it), so build assets are
          # uploaded to it directly rather than into a new draft. On manual
          # dispatch against a tag with no release, one is created (published).
          releaseDraft: false
          prerelease: false
          # Emits latest.json (the updater manifest) alongside the installers.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # tauri-action names installers with the version embedded
      # (Quito_0.0.4_aarch64.dmg), so there's no stable URL to link from a static
      # README. Upload a version-less COPY of this platform's installer to the
      # same release so releases/latest/download/<stable-name> always resolves to
      # the newest build. --clobber keeps manual re-runs idempotent. Runs after
      # the build above, so the bundle exists and the release already has assets.
      - name: Upload stable-named alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          src=$(ls ${{ matrix.bundle-glob }} 2>/dev/null | head -n1)
          if [ -z "$src" ]; then
            echo "::error::No bundle matched ${{ matrix.bundle-glob }}"; exit 1
          fi
          cp "$src" "${{ matrix.stable-name }}"
          gh release upload "$TAG" "${{ matrix.stable-name }}" --clobber --repo "$GITHUB_REPOSITORY"
