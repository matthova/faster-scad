# Standalone workspace: keeps the heavy Tauri dependency tree out of the main
# Rust workspace (and CI), while still depending on the quito crates by path.
[workspace]

[package]
name = "quito-desktop"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Quito desktop app (Tauri) — native OpenSCAD-compatible renderer"
rust-version = "1.85"

[lib]
name = "quito_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "quito-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Opens external URLs (e.g. the GitHub link) in the system browser.
tauri-plugin-opener = "2"
# In-app auto-update: `updater` pulls the signed release manifest and installs
# the platform artifact; `process` provides `relaunch` after an update lands.
# Desktop-only — the updater has no meaning on mobile targets.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

quito-syntax = { path = "../../crates/quito-syntax" }
quito-eval = { path = "../../crates/quito-eval" }
quito-geom = { path = "../../crates/quito-geom" }

[profile.release]
opt-level = 3
lto = "thin"
